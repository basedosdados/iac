apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-api-prod-config
  namespace: website
data:
  BASEDOSDADOS_BASE_URL: http://api-prod-service:80
  DB_HOST: cloud-sql-proxy
  DB_NAME: chatbot
  DB_PORT: "5432"
  DB_USER: chatbot
  ENVIRONMENT: production
  GOOGLE_BILLING_PROJECT: basedosdados
  GOOGLE_SERVICE_ACCOUNT: /var/secrets/chatbot-sa.json
  GOOGLE_GCS_BUCKET: chatbot-downloads-prod
  LANGSMITH_PROJECT: prod
  LANGSMITH_TRACING: "true"
  MODEL_URI: gpt-5.6-luna
  REASONING_EFFORT: medium
