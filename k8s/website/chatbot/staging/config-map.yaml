apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-api-staging-config
  namespace: website
data:
  BASEDOSDADOS_BASE_URL: http://api-staging-service:80
  DB_HOST: cloud-sql-proxy
  DB_NAME: chatbot_staging
  DB_PORT: "5432"
  DB_USER: chatbot_staging
  ENVIRONMENT: staging
  GOOGLE_BILLING_PROJECT: basedosdados
  GOOGLE_SERVICE_ACCOUNT: /var/secrets/chatbot-sa.json
  GOOGLE_GCS_BUCKET: chatbot-downloads-staging
  LANGSMITH_PROJECT: staging
  LANGSMITH_TRACING: "true"
  MODEL_URI: gpt-5.6-luna
  REASONING_EFFORT: medium
